# Common Labels
labels:
  app: "worker-registry"
  group: "health"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "worker-registry"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "worker_registry_schema"
    image:
      repository: "worker-registry-db"

# Container Configs
image:
  repository: "worker-registry"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/worker-registry/health"
  readinessProbePath: "/worker-registry/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx256m -Xms128m"
memory_limits: 384Mi
java-args: "-Dspring.profiles.active=monitoring"

# Additional Container Envs
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: worker-registry
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
    value: org.springframework.kafka.support.serializer.JsonSerializer
  - name: KAFKA_TOPIC_AUDIT
    value: audit-logs
  - name: ATTENDANCE_LOG_KAFKA_FIRST_SIGNATURE_TOPIC
    value: first-attendance-log
  - name: ATTENDANCE_KAFKA_TENANT_ID_PATTERN
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-tenant-id-pattern
        optional: true
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: KAFKA_CONFIG_BOOTSTRAP_SERVER_CONFIG
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true"
  {{- end }}
